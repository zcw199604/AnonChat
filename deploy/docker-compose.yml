# AnonChat 生产编排。首次使用请先复制 deploy/.env.example 为 deploy/.env 并填写真实值。
# 子网固定 172.28.0.0/24；只有 web 对外暴露端口，postgres/backend 仅在内网。
name: anonchat

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: anonchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: anonchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anonchat -d anonchat"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://anonchat:${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}@postgres:5432/anonchat?sslmode=disable
      TRUSTED_PROXIES: "172.28.0.0/24"
      WORDLIST_PATH: /etc/anonchat/wordlist/words.txt
      # 媒体文件根目录（挂载 media 卷）；启动时自动创建。
      MEDIA_ROOT: /data/media
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./wordlist:/etc/anonchat/wordlist:ro
      # 媒体库（图片/视频）持久化：MEDIA_ROOT=/data/media 见 environment。
      - media:/data/media
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - internal
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGUSER: anonchat
      PGDATABASE: anonchat
      PGPASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
      - ./backup:/backup:ro
      - ./backup/crontab:/etc/crontabs/root:ro
    entrypoint: ["sh", "-c", "exec crond -f -l 2"]
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  # 媒体库文件（后台媒体库里上传的图片/视频）。
  media:
  caddy_data:
  caddy_config:
  backups:
